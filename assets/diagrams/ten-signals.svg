<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The ten behavioral and verbal signals CEARA tracks</title>
<desc>Five signals are read live from camera and microphone during the interview; five are computed from the recorded audio after each answer</desc>
<rect width="680" height="320" fill="#FFFFFF"/>

<text x="40" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Live, during the interview</text>

<g>
<rect x="40" y="52" width="116" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="98" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Blink rate</text>
<text x="98" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">eye landmarks</text>
</g>
<g>
<rect x="166" y="52" width="116" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="224" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Eye contact</text>
<text x="224" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">iris position</text>
</g>
<g>
<rect x="292" y="52" width="116" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="350" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Posture</text>
<text x="350" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">shoulder symmetry</text>
</g>
<g>
<rect x="418" y="52" width="116" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="476" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Open posture</text>
<text x="476" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">wrist position</text>
</g>
<g>
<rect x="544" y="52" width="96" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="592" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Pitch</text>
<text x="592" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">F0 variance</text>
</g>

<text x="40" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Computed after each answer</text>

<g>
<rect x="40" y="162" width="116" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="98" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Filler words</text>
<text x="98" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">lexicon match</text>
</g>
<g>
<rect x="166" y="162" width="116" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="224" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Speaking pace</text>
<text x="224" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">words per minute</text>
</g>
<g>
<rect x="292" y="162" width="116" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="350" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Volume</text>
<text x="350" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">RMS consistency</text>
</g>
<g>
<rect x="418" y="162" width="116" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="476" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Pauses</text>
<text x="476" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">gap frequency</text>
</g>
<g>
<rect x="544" y="162" width="96" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="592" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Content</text>
<text x="592" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">LLM-scored</text>
</g>

<g>
<rect x="40" y="246" width="600" height="54" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="270" font-family="Arial, sans-serif" font-size="12" fill="#444441">Live signals feed the real-time confidence meter the interviewer sees during the session</text>
<text x="60" y="288" font-family="Arial, sans-serif" font-size="12" fill="#444441">Post-session signals feed the final scored report once the answer is complete</text>
</g>

</svg>
