<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CEARA system architecture</title>
<desc>A Streamlit UI thread coordinates three independent background threads for camera, transcription, and scoring, backed by SQLite storage and the Groq LLM API</desc>
<rect width="680" height="460" fill="#FFFFFF"/>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect x="40" y="30" width="600" height="70" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Streamlit UI thread</text>
<text x="340" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">renders screens, never blocks on slow work</text>
</g>

<line x1="160" y1="100" x2="160" y2="135" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="340" y1="100" x2="340" y2="135" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="520" y1="100" x2="520" y2="135" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>

<g>
<rect x="60" y="135" width="200" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#042C53">Camera thread</text>
<text x="160" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">WebRTC or direct capture</text>
<text x="160" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">MediaPipe signal extraction</text>
</g>

<g>
<rect x="240" y="135" width="200" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Transcription thread</text>
<text x="340" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">fast pass for live display</text>
<text x="340" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">accurate pass for scoring</text>
</g>

<g>
<rect x="420" y="135" width="200" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="520" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#412402">Scoring thread</text>
<text x="520" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">parallel LLM evaluation</text>
<text x="520" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">per-answer, after each turn</text>
</g>

<line x1="160" y1="215" x2="160" y2="250" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="340" y1="215" x2="340" y2="250" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="520" y1="215" x2="520" y2="250" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>

<g>
<rect x="40" y="250" width="600" height="50" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Shared signal &amp; transcript state</text>
<text x="340" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">thread-safe, polled by the UI on each refresh</text>
</g>

<line x1="340" y1="300" x2="340" y2="335" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>

<g>
<rect x="100" y="335" width="220" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="210" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215C">Groq API</text>
<text x="210" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Llama 3.3 70B scoring &amp; chat</text>
</g>

<g>
<rect x="360" y="335" width="220" height="70" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="470" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">SQLite storage</text>
<text x="470" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">sessions, scores, history</text>
</g>

<text x="340" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">A slow Whisper pass or a flaky API call never freezes the interview screen</text>

</svg>
