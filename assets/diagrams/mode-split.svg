<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CEARA's two operating modes</title>
<desc>Mode 1 has a human interviewer with CEARA assisting; Mode 2 has CEARA itself acting as the interviewer for a candidate</desc>
<rect width="680" height="300" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect x="40" y="30" width="280" height="240" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215C">Mode 1</text>
<text x="180" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Interviewer assistant</text>
</g>

<g>
<rect x="64" y="100" width="100" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="114" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Interviewer</text>
<text x="114" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">asks questions</text>
</g>

<g>
<rect x="196" y="100" width="100" height="50" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="246" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Candidate</text>
<text x="246" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">answers live</text>
</g>

<line x1="164" y1="125" x2="194" y2="125" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="100" y="190" width="160" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="180" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215C">CEARA watches</text>
<text x="180" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">signals, transcript, rubric</text>
</g>
<line x1="180" y1="150" x2="180" y2="188" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="360" y="30" width="280" height="240" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Mode 2</text>
<text x="500" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Candidate practice</text>
</g>

<g>
<rect x="384" y="100" width="100" height="50" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="434" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4B1528">CEARA</text>
<text x="434" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#72243E">is the interviewer</text>
</g>

<g>
<rect x="516" y="100" width="100" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="566" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Candidate</text>
<text x="566" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">practices solo</text>
</g>

<line x1="484" y1="125" x2="514" y2="125" stroke="#F0997B" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="420" y="190" width="160" height="56" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="500" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">CEARA scores</text>
<text x="500" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">content, STAR, signals</text>
</g>
<line x1="500" y1="150" x2="500" y2="188" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
