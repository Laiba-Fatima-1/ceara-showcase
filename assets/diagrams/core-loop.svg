<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CEARA's core evaluation loop</title>
<desc>Three repeating stages: see and hear the candidate, understand what they said, score against a standard</desc>
<rect width="680" height="200" fill="#FFFFFF"/>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect x="40" y="60" width="170" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">See &amp; hear</text>
<text x="125" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">camera + microphone, live</text>
</g>

<line x1="210" y1="92" x2="255" y2="92" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="255" y="60" width="170" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215C">Understand</text>
<text x="340" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">transcribe + interpret</text>
</g>

<line x1="425" y1="92" x2="470" y2="92" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="470" y="60" width="170" height="64" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="555" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Score</text>
<text x="555" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">against the rubric</text>
</g>

<path d="M555 124 C555 165, 125 165, 125 124" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
<text x="340" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">repeats for every question, every candidate</text>

</svg>
